<div class="container">

    <form method="POST">
        <div class="form-group">
            <label for="id_lecteur">Sélectionner le Lecteur</label>
            <select name="id_lecteur" id="id_lecteur" required>
                <option value="">-- Choisir un lecteur --</option>

                    </option>
                <?php endforeach; ?>
            </select>
        </div>

        <div class="form-group">

                        <option value="">-- Choisir un livre --</option>
                        <?php foreach ($livres as $livre): ?>

                                <?php echo htmlspecialchars($livre['TITRE']); ?>
                            </option>
                        <?php endforeach; ?>
                    </select>
                </div>
            </div>
            <button type="button" class="btn btn-add" onclick="addBookSelect()">+ Ajouter un autre livre</button>
        </div>

        <div style="display: flex; gap: 20px;">
            <div class="form-group" style="flex: 1;">
                <label for="date_emprunt">Date d'emprunt</label>
                <input type="date" name="date_emprunt" id="date_emprunt" required value="<?php echo date('Y-m-d'); ?>">

            <div class="form-group" style="flex: 1;">
                <label for="duree">Durée prévue (jours)</label>
                <input type="number" name="duree" id="duree" required value="14" min="1">
            </div>
        </div>

        <button type="submit" name="enregistrer_emprunt" class="btn btn-primary">💾 Valider l'emprunt</button>
